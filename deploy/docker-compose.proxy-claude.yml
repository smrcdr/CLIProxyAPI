name: smart-cli-proxy-claude

services:
  smart-cli-proxy-claude:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-proxy-claude}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: smart-cli-proxy:proxy-claude
    container_name: smart-cli-proxy-claude
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-20129}:8317"
    volumes:
      - ${RUNTIME_DIR:-../runtime-claude}/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ${RUNTIME_DIR:-../runtime-claude}/auths:/root/.cli-proxy-api
      - ${RUNTIME_DIR:-../runtime-claude}/logs:/CLIProxyAPI/logs
    networks:
      - smartapi-edge
    healthcheck:
      test: ["CMD-SHELL", "grep -aq CLIProxyAPI /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smartapi-edge:
    external: true
    name: smartapi-edge
