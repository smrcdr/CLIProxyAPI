name: smart-cli-proxy-dev

services:
  cliproxyapi-dev:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: smart-cli-proxy:dev
    container_name: cliproxyapi-dev
    restart: unless-stopped
    env_file:
      - ${RUNTIME_DIR:-../runtime}/service.env
    ports:
      - "127.0.0.1:8322:8317"
    volumes:
      - ${RUNTIME_DIR:-../runtime}/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ${RUNTIME_DIR:-../runtime}/auths:/root/.cli-proxy-api
      - ${RUNTIME_DIR:-../runtime}/logs:/CLIProxyAPI/logs
    networks:
      - smartapi-edge
    healthcheck:
      test: ["CMD-SHELL", "grep -aq CLIProxyAPI /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  fake-upstream:
    image: node:22-alpine
    container_name: cliproxyapi-fake-upstream-v2
    profiles: ["test"]
    restart: "no"
    working_dir: /app
    command: ["node", "fake-upstream.mjs"]
    volumes:
      - ./fake-upstream.mjs:/app/fake-upstream.mjs:ro
    networks:
      - smartapi-edge

  cliproxyapi-verify:
    image: smart-cli-proxy:dev
    container_name: cliproxyapi-verify
    profiles: ["test"]
    restart: "no"
    ports:
      - "127.0.0.1:8323:8317"
    volumes:
      - ${VERIFY_CONFIG:-./config.verify.yaml}:/CLIProxyAPI/config.yaml
    tmpfs:
      - /root/.cli-proxy-api
      - /CLIProxyAPI/logs
    networks:
      - smartapi-edge
    depends_on:
      - fake-upstream

networks:
  smartapi-edge:
    external: true
    name: smartapi-edge
