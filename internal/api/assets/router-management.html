    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)} button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,a:focus-visible{outline:none;box-shadow:var(--focus-ring)} a{color:inherit}.hidden{display:none!important}
    .login-view{min-height:100vh;display:grid;place-items:center;padding:var(--space-4)} .login-card{width:min(410px,100%);padding:var(--space-5);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:0 16px 44px rgba(49,38,28,.08)} .login-card h1{margin:0;font-size:1.65rem;letter-spacing:-.035em}.login-card p{color:var(--muted);margin:var(--space-1) 0 var(--space-5)}

    .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);margin-bottom:var(--space-4)}.metric-card,.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}.metric-card{padding:var(--space-4)}.metric-card span{display:block;color:var(--muted);font-size:.78rem}.metric-card strong{display:block;margin-top:.25rem;font-size:1.8rem;letter-spacing:-.04em}.panel{overflow:hidden;margin-bottom:var(--space-4)}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border)}.panel-header h2{margin:0;font-size:1rem}.panel-body{padding:var(--space-4)}.table-wrap{width:100%;overflow-x:auto}table{width:100%;min-width:580px;border-collapse:collapse;text-align:left}th,td{padding:.72rem var(--space-4);border-bottom:1px solid var(--border);white-space:nowrap}th{color:var(--muted);font-size:.75rem;font-weight:700}tr:last-child td{border-bottom:0}.empty{padding:2rem;color:var(--muted);text-align:center}.status{display:inline-flex;align-items:center;gap:.42rem}.status::before{content:"";width:.48rem;height:.48rem;border-radius:50%;background:var(--muted)}.status.ok::before{background:var(--positive)}.status.bad::before{background:var(--negative)}.code{font:.83rem ui-monospace,SFMono-Regular,Consolas,monospace}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--space-3)}.detail{padding:var(--space-3);border:1px solid var(--border);border-radius:9px;background:var(--bg)}.detail dt{color:var(--muted);font-size:.76rem}.detail dd{margin:.2rem 0 0;font-weight:650;overflow-wrap:anywhere}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--space-4)}.form-grid .wide{grid-column:1/-1}.choice-list{display:flex;flex-wrap:wrap;gap:.45rem .8rem}.choice{display:inline-flex;align-items:center;gap:.35rem;font-size:.86rem}.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:.12rem .42rem;color:var(--muted);font-size:.72rem;margin:.08rem .18rem .08rem 0}.actions{display:flex;flex-wrap:wrap;gap:.4rem}.form-actions{display:flex;justify-content:flex-end;gap:.55rem;border-top:1px solid var(--border);padding-top:var(--space-4)}.form-error{color:var(--negative);font-size:.84rem;min-height:1.2em}.load-errors{border-color:var(--negative)}.load-errors ul{margin:0;padding-left:1.2rem;color:var(--negative)}.muted{color:var(--muted)}
    #toast-region{position:fixed;right:var(--space-4);bottom:var(--space-4);z-index:10;display:grid;gap:var(--space-2);width:min(360px,calc(100vw - 2 * var(--space-4)))}.toast{padding:.75rem .9rem;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface);box-shadow:0 8px 25px rgba(49,38,28,.15)}.toast.error{border-left-color:var(--negative)}.toast.success{border-left-color:var(--positive)}
    @media(max-width:900px){.app-view{grid-template-columns:minmax(0,1fr)}.sidebar{border-right:0;border-bottom:1px solid var(--border);padding:var(--space-3) var(--space-4);gap:var(--space-3);min-width:0}#navigation{display:flex;overflow-x:auto;gap:.2rem}.nav-link{white-space:nowrap;padding:.5rem .65rem}.nav-link.active{box-shadow:inset 0 -3px 0 var(--accent)}.sidebar-meta{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;margin-top:0}.sidebar-meta .button{width:auto;text-align:center}.main-content{padding:var(--space-4);min-width:0;overflow-wrap:anywhere}}
    @media(max-width:500px){.page-header{flex-direction:column}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-card{padding:var(--space-3)}.metric-card strong{font-size:1.45rem}.form-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
    .filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);padding:var(--space-4);border-bottom:1px solid var(--border)}.filter-grid .field{margin:0}.snapshot-note{color:var(--muted);font-size:.84rem}.status-badge{white-space:nowrap}.status-badge.good{color:var(--positive)}.status-badge.bad{color:var(--negative)}.status-badge.warn{color:var(--warning)}@media(max-width:500px){.status-badge{white-space:normal;overflow-wrap:anywhere}}
  </style>

<body>
  <div id="login-view" class="login-view"><form id="login-form" class="login-card"><h1>SmartRouter</h1><p>Sign in to the router control plane.</p><div class="field"><label for="management-key">Management key</label><input id="management-key" class="input" type="password" autocomplete="current-password" required></div><p id="login-error" class="login-error" role="alert"></p><button class="button primary" type="submit">Sign in</button></form></div>
  <div id="app-view" class="app-view hidden"><aside class="sidebar" aria-label="SmartRouter navigation"><a class="brand" href="#overview">SmartRouter</a><nav id="navigation"></nav><div class="sidebar-meta"><span id="revision-label">Revision —</span><span id="sync-label">Not synced</span><button id="refresh-button" class="button" type="button">Refresh</button><button id="theme-button" class="button" type="button">Toggle theme</button><button id="logout-button" class="button" type="button">Logout</button></div></aside><main class="main-content"><header class="page-header"><div><p class="eyebrow">Router control plane</p><h1 id="page-title">Overview</h1></div><span id="connection-badge" class="status-badge">Disconnected</span></header><section id="page-content" aria-live="polite"></section></main></div>
  <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script>
    const API_ROOT = "/v0/management/router";
    const SESSION_KEY = "smart-router-management-key";
    const NAV_ITEMS = [["overview","Overview"],["upstreams","Upstreams"],["model-groups","Model groups"],["route-state","Route state"],["metrics","Metrics"],["network-policy","Network policy"]];
    const app = { key:sessionStorage.getItem(SESSION_KEY)||"", revision:null, theme:sessionStorage.getItem("smart-router-theme")||"light", activeView:"overview", stale:true, conflict:false, conflictRecoveryReady:false, loading:false, upstreams:[], modelGroups:[], routeStates:[], metrics:null, metricsFilters:{model:"",endpoint:"",route:"",upstream:"",result:""}, networkPolicy:null, networkPolicyFormOpen:false, schemas:{}, loadErrors:{}, upstreamFormId:null, upstreamFormOpen:false, modelGroupFormId:null, modelGroupFormOpen:false, routeFormGroupId:null, routeFormId:null, routeFormOpen:false, conflictForm:null, conflictRevision:null, validationResults:{} };
    let pollTimer = null;
    const $ = id => document.getElementById(id);
    function showToast(message,tone="info"){if(!message)return;const toast=document.createElement("div");toast.className=`toast ${tone}`;toast.textContent=message;$("toast-region").append(toast);window.setTimeout(()=>toast.remove(),4500)}
    function setTheme(theme){app.theme=theme==="dark"?"dark":"light";document.documentElement.dataset.theme=app.theme;sessionStorage.setItem("smart-router-theme",app.theme)}
    function updateMeta(){$("revision-label").textContent=app.revision===null?"Revision —":`Revision ${app.revision}`;$("sync-label").textContent=app.stale?"Needs refresh":"Synced just now";const badge=$("connection-badge");badge.textContent=app.stale?"Stale":"Connected";badge.className=`status-badge ${app.stale?"stale":"connected"}`}
    function revisionFrom(data){if(Number.isInteger(data?.revision)){app.revision=app.revision===null?data.revision:Math.max(app.revision,data.revision)}}
    async function api(path,options={}){const {mutation,polling,...requestOptions}=options;if(mutation&&(app.stale||app.conflict)){const error=new Error("Router state is stale. Refresh before saving.");error.status=409;error.gated=true;throw error}const headers=new Headers(requestOptions.headers||{});if(app.key)headers.set("Authorization",`Bearer ${app.key}`);if(requestOptions.body!==undefined)headers.set("Content-Type","application/json");if(mutation&&app.revision!==null)headers.set("If-Match",`"${app.revision}"`);const response=await fetch(`${API_ROOT}${path}`,{...requestOptions,headers,body:requestOptions.body===undefined?undefined:JSON.stringify(requestOptions.body),cache:"no-store"});let data=null;try{data=await response.json()}catch(_){}if(!response.ok){const error=new Error(data?.error||`HTTP ${response.status}`);error.status=response.status;error.data=data;const etag=response.headers.get("ETag")||response.headers.get("etag");if(etag){const match=etag.match(/"?(\d+)"?/);if(match)error.revision=Number(match[1])}throw error}if(!polling)revisionFrom(data);return data}
    const LOAD_ITEMS=[["state","/state"],["upstreams","/upstreams"],["modelGroups","/model-groups"],["routeStates","/routes/state"],["metrics","/metrics"],["networkPolicy","/network-policy"],["upstreamTypes","/schemas/upstream-types"],["modelGroupSchema","/schemas/model-group"],["networkPolicySchema","/schemas/network-policy"]];
    function responseValue(name,data){if(name==="upstreams"||name==="modelGroups"||name==="routeStates")return data?.items;if(name==="metrics")return data?.metrics;if(name==="networkPolicy")return data?.network_policy;if(name==="upstreamTypes"||name==="modelGroupSchema"||name==="networkPolicySchema")return data;return data}
    async function loadAll(options={}){if(!app.key)return {success:false,failures:1,revision:null};const recovering=options.recovering===true;app.loading=true;if(!recovering)render();const results=await Promise.all(LOAD_ITEMS.map(([,path])=>api(path).then(value=>({status:"fulfilled",value})).catch(reason=>({status:"rejected",reason}))));app.loadErrors={};let failures=0,serverRevision=null;results.forEach((result,index)=>{const [name]=LOAD_ITEMS[index];if(result.status==="rejected"){failures++;app.loadErrors[name]=result.reason?.message||"Unable to load this resource";return}const data=result.value;if(name==="state"){if(!Number.isInteger(data?.revision)){failures++;app.loadErrors[name]="Missing server revision";return}serverRevision=data.revision}revisionFrom(data);const value=responseValue(name,data);if(value===undefined){failures++;app.loadErrors[name]="Unexpected response envelope";return}if(name==="upstreams")app.upstreams=value;if(name==="modelGroups")app.modelGroups=value;if(name==="routeStates")app.routeStates=value;if(name==="metrics")app.metrics=value;if(name==="networkPolicy")app.networkPolicy=value;if(name==="upstreamTypes")app.schemas.upstreamTypes=value;if(name==="modelGroupSchema")app.schemas.modelGroup=value;if(name==="networkPolicySchema")app.schemas.networkPolicy=value});if(recovering&&Number.isInteger(serverRevision))app.revision=serverRevision;app.loading=false;const success=failures===0&&Number.isInteger(serverRevision);app.stale=recovering||failures>0;if(failures===0&&!recovering)app.conflict=false;app.conflictRecoveryReady=recovering&&success;const first=results.find(result=>result.status==="rejected");if(first?.reason?.status===401){logout(false);showToast("Invalid or expired management key","error");return {success:false,failures,revision:serverRevision}}if(first?.reason?.status===409){app.conflict=true;showToast("Server state changed. Review the refreshed values before saving.","error")}else if(failures)showToast("Some router data could not be loaded","error");if(recovering)updateMeta();else render();return {success,failures,revision:serverRevision,errors:app.loadErrors}}
    async function handleApiError(error,fallback="Unable to load router data"){if(error?.status===401){logout(false);showToast("Invalid or expired management key","error");return {success:false,failures:1}}if(error?.status===409){app.stale=true;app.conflict=true;app.conflictRecoveryReady=false;updateMeta();showToast(error.gated?error.message:"Server state changed. Review the refreshed values before saving.","error");const recovery=await loadAll({recovering:true});return recovery}app.stale=true;app.conflictRecoveryReady=false;updateMeta();showToast(error?.message||fallback,"error");return {success:false,failures:1}}
    async function refreshStateAndMetrics(){if(!app.key)return;const knownRevision=app.revision;const results=await Promise.allSettled([api("/state",{polling:true}),api("/metrics",{polling:true})]);const stateResult=results[0],metricsResult=results[1];let staleDetected=false,driftRevision=null;if(stateResult.status==="fulfilled"){delete app.loadErrors.state;if(knownRevision!==null&&Number.isInteger(stateResult.value?.revision)&&stateResult.value.revision!==knownRevision){staleDetected=true;driftRevision=stateResult.value.revision}}else{app.loadErrors.state=stateResult.reason?.message||"Unable to load state";staleDetected=true}if(metricsResult.status==="fulfilled"){delete app.loadErrors.metrics;if(metricsResult.value?.metrics!==undefined)app.metrics=metricsResult.value.metrics}else{app.loadErrors.metrics=metricsResult.reason?.message||"Unable to load metrics";staleDetected=true}if(stateResult.status==="rejected"&&stateResult.reason?.status===401||metricsResult.status==="rejected"&&metricsResult.reason?.status===401){logout(false);showToast("Invalid or expired management key","error");return}if(staleDetected){app.stale=true;const form=activeEditorForm();if(form){app.conflict=true;app.conflictRecoveryReady=false;renderConflict(form,{revision:driftRevision});updateMeta();return}}updateMeta();if(app.activeView==="metrics"&&$("metrics-results"))renderMetricsResults($("metrics-results"));else render()}
    function activeEditorForm(){if(app.upstreamFormOpen&&$("upstream-form"))return $("upstream-form");if(app.modelGroupFormOpen&&$("model-group-form"))return $("model-group-form");if(app.routeFormOpen&&$("route-form"))return $("route-form");if(app.networkPolicyFormOpen&&$("network-policy-form"))return $("network-policy-form");return null}
    function setView(view){const valid=NAV_ITEMS.some(([id])=>id===view)?view:"overview";if(valid!=="network-policy")app.networkPolicyFormOpen=false;app.activeView=valid;if(window.location.hash!==`#${valid}`)window.history.replaceState(null,"",`#${valid}`);renderNavigation();render()}
    function renderNavigation(){const navigation=$("navigation");navigation.replaceChildren();NAV_ITEMS.forEach(([id,label])=>{const link=document.createElement("a");link.className=`nav-link ${app.activeView===id?"active":""}`;link.href=`#${id}`;link.textContent=label;navigation.append(link)})}
    function value(item,fallback="—"){return item===undefined||item===null||item===""?fallback:String(item)}
    function panel(title,content){const section=document.createElement("section");section.className="panel";const header=document.createElement("div");header.className="panel-header";const heading=document.createElement("h2");heading.textContent=title;header.append(heading);section.append(header,content);return section}
    function table(headers,rows,empty="No records yet"){const wrap=document.createElement("div");wrap.className="table-wrap";if(!rows.length){const blank=document.createElement("div");blank.className="empty";blank.textContent=empty;wrap.append(blank);return wrap}const tableNode=document.createElement("table"),thead=document.createElement("thead"),headRow=document.createElement("tr");headers.forEach(header=>{const th=document.createElement("th");th.textContent=header;headRow.append(th)});thead.append(headRow);tableNode.append(thead);const tbody=document.createElement("tbody");rows.forEach(row=>{const tr=document.createElement("tr");row.forEach(cell=>{const td=document.createElement("td");if(cell instanceof Node)td.append(cell);else td.textContent=value(cell);tr.append(td)});tbody.append(tr)});tableNode.append(tbody);wrap.append(tableNode);return wrap}
    function detailGrid(entries){const dl=document.createElement("dl");dl.className="detail-grid";entries.forEach(([label,item])=>{const block=document.createElement("div");block.className="detail";const dt=document.createElement("dt");dt.textContent=label;const dd=document.createElement("dd");dd.textContent=value(item);block.append(dt,dd);dl.append(block)});return dl}
    function errorPanel(){const entries=Object.entries(app.loadErrors);if(!entries.length)return null;const list=document.createElement("ul");entries.forEach(([name,message])=>{const item=document.createElement("li");item.textContent=`${name}: ${message}`;list.append(item)});return panel("Data unavailable",list)}
    function metricCard(label,item){const card=document.createElement("div");card.className="metric-card";const span=document.createElement("span");span.textContent=label;const strong=document.createElement("strong");strong.textContent=value(item);card.append(span,strong);return card}
    function average(items,countKey,totalKey){const rows=Array.isArray(items)?items:[],count=rows.reduce((sum,item)=>sum+Number(item?.[countKey]||0),0);if(count===0)return "—";const total=rows.reduce((sum,item)=>sum+Number(item?.[totalKey]||0),0);return `${(total/count).toFixed(1)} ms`}
    function renderOverview(){const metricsAvailable=app.metrics!==null&&!app.loadErrors.metrics,totals=metricsAvailable?app.metrics.totals||{}:{},requests=metricsAvailable?Number(totals.requests||0):"—",successRate=metricsAvailable&&Number(requests)>0?`${((Number(totals.successes||0)/Number(requests))*100).toFixed(1)}%`:"—",active=app.loadErrors.routeStates?"—":app.routeStates.filter(item=>item.enabled).length,open=app.loadErrors.routeStates?"—":app.routeStates.filter(item=>String(item.state||"").toLowerCase()==="open").length,grid=document.createElement("div");grid.className="metric-grid";[["Requests",requests],["Success rate",successRate],["Attempts",metricsAvailable?Number(totals.attempts||0):"—"],["Failovers",metricsAvailable?Number(totals.failovers||0):"—"],["Active routes",active],["Open circuits",open],["Avg latency",metricsAvailable?average(app.metrics.requests,"latency_count","latency_total_ms"):"—"],["Avg TTFT",metricsAvailable?average(app.metrics.requests,"ttft_count","ttft_total_ms"):"—"]].forEach(([label,item])=>grid.append(metricCard(label,item)));const content=document.createElement("div");content.append(grid,panel("Router state",detailGrid([["Revision",app.revision],["Sync",app.stale?"Needs refresh":"Current"],["Theme",app.theme]])));const groups=table(["Public model","Capability","Strategy","Routes","Status"],app.modelGroups.map(item=>[item.public_model||item.id,item.capability,item.selection?.strategy,item.routes?.length??0,item.enabled?"Enabled":"Disabled"]));content.append(panel("Model groups",groups));const health=table(["Route","Upstream","Model group","Health","State"],app.routeStates.map(item=>[item.route_id,item.upstream_id,item.model_group_id,routeHealth(item),item.state]));content.append(panel("Route health",health));return content}
    function routeHealth(item){const state=String(item?.state||"").toLowerCase(),transport=String(item?.transport_health||"").toLowerCase();if(state==="open")return "Circuit open";if(transport.includes("unhealthy")||transport.includes("fail"))return "Unhealthy";if(state||transport)return "Healthy";return "Unknown"}
    function hostOnly(raw){try{const parsed=new URL(raw);return `${parsed.protocol}//${parsed.host}`}catch(_){return value(raw)}}
    function badges(item){const wrap=document.createElement("span");(item.capabilities?.endpoints||[]).forEach(endpoint=>{const badge=document.createElement("span");badge.className="badge";badge.textContent=endpoint;wrap.append(badge)});["streaming","tools","vision_input","image_generation"].forEach(key=>{if(item.capabilities?.[key]){const badge=document.createElement("span");badge.className="badge";badge.textContent=key.replaceAll("_"," ");wrap.append(badge)}});return wrap}

    function reconcileConflict(form){if(!app.conflictRecoveryReady)return;app.conflict=false;app.stale=false;app.conflictRecoveryReady=false;app.conflictForm=null;app.conflictRevision=null;const notice=form.querySelector("[data-conflict]");if(notice)notice.remove();setConflictSaveDisabled(form,false);updateMeta()}
    function renderModelGroupForm(){const existing=app.modelGroups.find(item=>item.id===app.modelGroupFormId),schema=app.schemas.modelGroup||{},form=document.createElement("form");form.id="model-group-form";form.className="panel-body";form.dataset.id=existing?.id||"";const section=panel(existing?"Edit model group":"Add model group",form),grid=document.createElement("div");grid.className="form-grid";const id=document.createElement("input");id.id="model-group-id";id.className="input";id.required=true;id.disabled=!!existing;id.value=existing?.id||"";grid.append(field("ID",id));const publicModel=document.createElement("input");publicModel.id="model-group-public-model";publicModel.className="input";publicModel.required=true;publicModel.value=existing?.public_model||"";grid.append(field("Public model",publicModel));const capabilities=schema.capabilities||schemaOptions("capability",["text","image"]),capability=selectControl("model-group-capability",capabilities,existing?.capability||capabilities[0]);grid.append(field("Capability",capability));const strategies=schema.selection_strategies||["weighted-round-robin","weighted-affinity"],strategy=selectControl("model-group-strategy",strategies,existing?.selection?.strategy||strategies[0]);grid.append(field("Selection strategy",strategy));const ttl=document.createElement("input");ttl.id="model-group-affinity-ttl";ttl.className="input";ttl.value=existing?.selection?.affinity_ttl||"";ttl.placeholder="e.g. 15m";grid.append(field("Affinity TTL",ttl));const enabled=document.createElement("input");enabled.id="model-group-enabled";enabled.type="checkbox";enabled.checked=existing?existing.enabled:true;grid.append(field("Enabled",enabled));form.append(grid);const errors=document.createElement("div");errors.dataset.formErrors="true";errors.className="form-error";form.append(errors);const actions=document.createElement("div");actions.className="form-actions";actions.append(button("Cancel","cancel-model-group"),button(existing?"Save changes":"Create model group","save-model-group",null,true));form.append(actions);return section}
    function modelGroupPayload(form){const payload={public_model:form.querySelector("#model-group-public-model").value.trim(),enabled:form.querySelector("#model-group-enabled").checked,capability:form.querySelector("#model-group-capability").value,selection:{strategy:form.querySelector("#model-group-strategy").value,affinity_ttl:form.querySelector("#model-group-affinity-ttl").value.trim()}};if(!form.dataset.id)payload.id=form.querySelector("#model-group-id").value.trim();return payload}
    function openModelGroupForm(groupId){app.modelGroupFormId=groupId||null;app.modelGroupFormOpen=true;app.routeFormGroupId=null;app.routeFormId=null;app.routeFormOpen=false;app.activeView="model-groups";if(window.location.hash!=="#model-groups")window.history.replaceState(null,"","#model-groups");renderNavigation();render()}
    function openRouteForm(groupId,routeId){app.routeFormGroupId=groupId||null;app.routeFormId=routeId||null;app.routeFormOpen=true;app.modelGroupFormId=null;app.modelGroupFormOpen=false;app.activeView="model-groups";if(window.location.hash!=="#model-groups")window.history.replaceState(null,"","#model-groups");renderNavigation();render()}
    async function saveModelGroup(form){const groupId=form.dataset.id||form.querySelector("#model-group-id").value.trim();try{await api(form.dataset.id?`/model-groups/${encodeURIComponent(form.dataset.id)}`:"/model-groups",{method:form.dataset.id?"PATCH":"POST",mutation:true,body:modelGroupPayload(form)});delete app.validationResults[groupId];app.modelGroupFormId=null;app.modelGroupFormOpen=false;app.conflictForm=null;await loadAll();showToast(form.dataset.id?"Model group updated":"Model group created","success")}catch(error){if(error.status===422){formError(form,error.data?.error||error.message);return}if(error.status===409){const recovery=await handleApiError(error,"Unable to save model group");renderConflict(form,{revision:recovery?.revision??error.revision});return}await handleApiError(error,"Unable to save model group")}}
    async function deleteModelGroup(id){if(!window.confirm("Delete this model group and all of its routes? This cannot be undone."))return;try{await api(`/model-groups/${encodeURIComponent(id)}`,{method:"DELETE",mutation:true});delete app.validationResults[id];await loadAll();showToast("Model group deleted","success")}catch(error){await handleApiError(error,"Unable to delete model group")}}
    async function validateModelGroup(id){try{const data=await api(`/model-groups/${encodeURIComponent(id)}/validate`,{method:"POST"});const result=data?.valid===true?"valid":JSON.stringify(data);app.validationResults[id]=result;showToast(`Validation result: ${result}. Configuration was not saved.`,"success");if(app.activeView==="model-groups"&&!app.modelGroupFormOpen&&!app.routeFormOpen)render()}catch(error){const result=error.data?.error||error.message;app.validationResults[id]=result;showToast(`Validation result: ${result}. Configuration was not saved.`,"error");await handleApiError(error,"Unable to validate model group")}}
    function renderRouteForm(){const group=app.modelGroups.find(item=>item.id===app.routeFormGroupId),existing=group?.routes?.find(item=>item.id===app.routeFormId),schema=app.schemas.modelGroup||{},fields=schema.route_fields||[],form=document.createElement("form");form.id="route-form";form.className="panel-body";form.dataset.groupId=group?.id||"";form.dataset.id=existing?.id||"";const section=panel(existing?"Edit route":"Add route",form),grid=document.createElement("div");grid.className="form-grid";const id=document.createElement("input");id.id="route-id";id.className="input";id.required=true;id.disabled=!!existing;id.value=existing?.id||"";grid.append(field("ID",id));const upstream=document.createElement("select");upstream.id="route-upstream-id";upstream.className="input";const known=new Set(app.upstreams.map(item=>item.id));if(existing?.upstream_id&&!known.has(existing.upstream_id)){const missing=document.createElement("option");missing.value=existing.upstream_id;missing.textContent=`Missing upstream: ${existing.upstream_id}`;missing.selected=true;missing.className="status bad";upstream.append(missing)}app.upstreams.forEach(item=>{const option=document.createElement("option");option.value=item.id;option.textContent=item.name||item.id;option.selected=item.id===existing?.upstream_id;upstream.append(option)});if(!upstream.options.length){const empty=document.createElement("option");empty.value="";empty.textContent="No upstreams loaded";empty.disabled=true;empty.selected=true;upstream.append(empty)}grid.append(field("Upstream",upstream));const model=document.createElement("input");model.id="route-upstream-model";model.className="input";model.required=true;model.value=existing?.upstream_model||"";grid.append(field("Upstream model",model));const priority=document.createElement("input");priority.id="route-priority";priority.className="input";priority.type="number";priority.min=fields.find(item=>item.name==="priority")?.minimum??-10000;priority.max=fields.find(item=>item.name==="priority")?.maximum??10000;priority.value=existing?.priority??fields.find(item=>item.name==="priority")?.default??0;grid.append(field("Priority (route order)",priority));const weight=document.createElement("input");weight.id="route-weight";weight.className="input";weight.type="number";weight.min=fields.find(item=>item.name==="weight")?.minimum??1;weight.max=fields.find(item=>item.name==="weight")?.maximum??10000;weight.value=existing?.weight??fields.find(item=>item.name==="weight")?.default??100;grid.append(field("Weight",weight));const enabled=document.createElement("input");enabled.id="route-enabled";enabled.type="checkbox";enabled.checked=existing?existing.enabled:true;grid.append(field("Enabled",enabled));form.append(grid);const errors=document.createElement("div");errors.dataset.formErrors="true";errors.className="form-error";form.append(errors);const actions=document.createElement("div");actions.className="form-actions";actions.append(button("Cancel","cancel-route"),button(existing?"Save changes":"Create route","save-route",null,true));form.append(actions);return section}
    function routePayload(form){const payload={upstream_id:form.querySelector("#route-upstream-id").value,upstream_model:form.querySelector("#route-upstream-model").value.trim(),priority:Number(form.querySelector("#route-priority").value),weight:Number(form.querySelector("#route-weight").value),enabled:form.querySelector("#route-enabled").checked};if(!form.dataset.id)payload.id=form.querySelector("#route-id").value.trim();return payload}
    async function saveRoute(form){const groupId=form.dataset.groupId;try{const group=encodeURIComponent(groupId),route=encodeURIComponent(form.dataset.id);await api(form.dataset.id?`/model-groups/${group}/routes/${route}`:`/model-groups/${group}/routes`,{method:form.dataset.id?"PATCH":"POST",mutation:true,body:routePayload(form)});delete app.validationResults[groupId];app.routeFormOpen=false;app.routeFormGroupId=null;app.routeFormId=null;app.conflictForm=null;await loadAll();showToast(form.dataset.id?"Route updated":"Route created","success")}catch(error){if(error.status===422){formError(form,error.data?.error||error.message);return}if(error.status===409){const recovery=await handleApiError(error,"Unable to save route");renderConflict(form,{revision:recovery?.revision??error.revision});return}await handleApiError(error,"Unable to save route")}}
    async function deleteRoute(groupId,routeId){if(!window.confirm("Delete this route? This cannot be undone."))return;try{await api(`/model-groups/${encodeURIComponent(groupId)}/routes/${encodeURIComponent(routeId)}`,{method:"DELETE",mutation:true});delete app.validationResults[groupId];await loadAll();showToast("Route deleted","success")}catch(error){await handleApiError(error,"Unable to delete route")}}
    function render(){if($("app-view").classList.contains("hidden"))return;if(app.conflict&&(app.upstreamFormOpen||app.modelGroupFormOpen||app.routeFormOpen||app.networkPolicyFormOpen)){updateMeta();return}const titles=Object.fromEntries(NAV_ITEMS);$("page-title").textContent=titles[app.activeView]||"Overview";const content=$("page-content");content.replaceChildren();const intro=document.createElement("p");intro.className="view-intro";intro.textContent=app.loading?"Loading router data…":"Review the current SmartRouter configuration and runtime health.";content.append(intro);const errors=errorPanel();if(errors)content.append(errors);if(app.activeView==="upstreams"&&app.upstreamFormOpen)content.append(renderUpstreamForm());else if(app.activeView==="model-groups"&&app.modelGroupFormOpen)content.append(renderModelGroupForm());else if(app.activeView==="model-groups"&&app.routeFormOpen)content.append(renderRouteForm());else{const views={overview:renderOverview,upstreams:renderUpstreams,"model-groups":renderModelGroups,"route-state":renderRouteState,metrics:renderMetrics,"network-policy":renderNetworkPolicy};content.append(views[app.activeView]())}updateMeta()}
    function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=window.setInterval(refreshStateAndMetrics,5000)}
    function logout(showMessage=true){if(pollTimer){clearInterval(pollTimer);pollTimer=null}app.key="";app.conflict=false;app.conflictRecoveryReady=false;app.conflictForm=null;app.conflictRevision=null;app.networkPolicyFormOpen=false;app.upstreamFormId=null;app.upstreamFormOpen=false;app.modelGroupFormId=null;app.modelGroupFormOpen=false;app.routeFormGroupId=null;app.routeFormId=null;app.routeFormOpen=false;sessionStorage.removeItem(SESSION_KEY);$("management-key").value="";$("app-view").classList.add("hidden");$("login-view").classList.remove("hidden");$("management-key").focus();if(showMessage)showToast("Signed out","success")}
    async function establishSession(input){const result=await loadAll();if(result?.success!==true){const message=result?.errors&&Object.values(result.errors)[0]||"Unable to load router data";logout(false);$("login-error").textContent=message;return false}sessionStorage.setItem(SESSION_KEY,app.key);input.value="";$("login-view").classList.add("hidden");$("app-view").classList.remove("hidden");setView(window.location.hash.slice(1)||"overview");startPolling();showToast("Connected","success");return true}
    $("login-form").addEventListener("submit",async event=>{event.preventDefault();const input=$("management-key"),button=event.currentTarget.querySelector("button");app.key=input.value.trim();$("login-error").textContent="";button.disabled=true;try{await api("/state");await establishSession(input)}catch(error){app.key="";sessionStorage.removeItem(SESSION_KEY);$("login-error").textContent=error.status===401?"Invalid management key":error.message}finally{button.disabled=false}});
    $("refresh-button").addEventListener("click",()=>loadAll());$("theme-button").addEventListener("click",()=>{setTheme(app.theme==="dark"?"light":"dark");render()});$("logout-button").addEventListener("click",()=>logout());$("page-content").addEventListener("click",event=>{const target=event.target.closest("[data-action]");if(!target)return;const id=target.dataset.id,action=target.dataset.action;if(action==="add"||action==="edit")openUpstreamForm(action==="edit"?id:null);if(action==="cancel"){app.upstreamFormId=null;app.upstreamFormOpen=false;render()}if(action==="test")testUpstream(id);if(action==="enable")toggleUpstream(id,true);if(action==="disable")toggleUpstream(id,false);if(action==="delete")deleteUpstream(id);if(action==="route-probe")probeRoute(id);if(action==="route-reset")resetCircuit(id);if(action==="save"){const form=target.closest("form");if(form)form.requestSubmit()}if(action==="group-add")openModelGroupForm(null);if(action==="group-edit")openModelGroupForm(id);if(action==="group-delete")deleteModelGroup(id);if(action==="group-validate")validateModelGroup(id);if(action==="route-add")openRouteForm(id,null);if(action==="route-edit"){const parts=id.split(":");openRouteForm(parts.shift(),parts.join(":"))}if(action==="route-delete"){const parts=id.split(":");deleteRoute(parts.shift(),parts.join(":"))}if(action==="cancel-model-group"){app.modelGroupFormOpen=false;app.modelGroupFormId=null;render()}if(action==="cancel-route"){app.routeFormOpen=false;app.routeFormGroupId=null;app.routeFormId=null;render()}if(action==="save-model-group"){const form=target.closest("form");if(form)form.requestSubmit()}if(action==="save-route"){const form=target.closest("form");if(form)form.requestSubmit()}if(action==="save-network-policy"){const form=target.closest("form");if(form)saveNetworkPolicy(form)}if(action==="conflict-reload"){const form=target.closest("form");if(form)reloadConflict(form)}if(action==="conflict-reconcile"){const form=target.closest("form");if(form)reconcileConflict(form)}});
    $("page-content").addEventListener("submit",event=>{if(["upstream-form","model-group-form","route-form","network-policy-form"].includes(event.target.id)){event.preventDefault();if(event.target.id==="upstream-form")saveUpstream(event.target);if(event.target.id==="model-group-form")saveModelGroup(event.target);if(event.target.id==="route-form")saveRoute(event.target);if(event.target.id==="network-policy-form")saveNetworkPolicy(event.target)}});window.addEventListener("hashchange",()=>setView(window.location.hash.slice(1)||"overview"));setTheme(app.theme);renderNavigation();if(app.key){establishSession($("management-key"))}else $("management-key").focus();
