<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SmartRouter</title>
  <style>
    :root { --accent:#E56A4A; --accent-strong:#bd4930; --bg:#f7f3ed; --surface:#fffdf9; --surface-muted:#efe9df; --text:#302a26; --muted:#776c64; --border:#d8cec1; --positive:#27745a; --negative:#a64040; --warning:#9a681d; --space-1:.35rem; --space-2:.6rem; --space-3:.9rem; --space-4:1.25rem; --space-5:1.8rem; --radius:12px; --focus-ring:0 0 0 3px rgba(229,106,74,.28); font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    :root[data-theme="dark"] { --bg:#1e1c1b; --surface:#292523; --surface-muted:#38312d; --text:#f4eee7; --muted:#b9aaa0; --border:#514840; --accent-strong:#f18a6c; --positive:#76c39e; --negative:#ef8c86; --warning:#e4b56a }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)} button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,a:focus-visible{outline:none;box-shadow:var(--focus-ring)} a{color:inherit}.hidden{display:none!important}
    .login-view{min-height:100vh;display:grid;place-items:center;padding:var(--space-4)} .login-card{width:min(410px,100%);padding:var(--space-5);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:0 16px 44px rgba(49,38,28,.08)} .login-card h1{margin:0;font-size:1.65rem;letter-spacing:-.035em}.login-card p{color:var(--muted);margin:var(--space-1) 0 var(--space-5)}
    .field{display:grid;gap:var(--space-1);margin-bottom:var(--space-4)}.field label{font-weight:650;font-size:.83rem}.input{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:.65rem .75rem}.input:focus{border-color:var(--accent);outline:none;box-shadow:var(--focus-ring)}.button{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:.58rem .85rem;font-weight:650}.button:hover{border-color:var(--accent)}.button.primary{border-color:var(--accent);background:var(--accent);color:#fffaf7}.button:disabled{cursor:wait;opacity:.6}.login-error{min-height:1.5em;margin:0 0 var(--space-3)!important;color:var(--negative);font-size:.9rem}
    .app-view{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{display:flex;flex-direction:column;gap:var(--space-5);padding:var(--space-5) var(--space-4);border-right:1px solid var(--border);background:var(--surface)}.brand{color:var(--text);text-decoration:none;font-size:1.25rem;font-weight:760;letter-spacing:-.035em}.brand::before{content:"◎";color:var(--accent);margin-right:.55rem}#navigation{display:grid;gap:.25rem}.nav-link{border-radius:8px;color:var(--muted);padding:.62rem .7rem;text-decoration:none}.nav-link:hover,.nav-link.active{color:var(--text);background:var(--surface-muted)}.nav-link.active{box-shadow:inset 3px 0 0 var(--accent);font-weight:700}.sidebar-meta{display:grid;gap:var(--space-2);margin-top:auto;color:var(--muted);font-size:.8rem}.sidebar-meta .button{width:100%;text-align:left;padding:.45rem .62rem;font-size:.82rem}.main-content{min-width:0;padding:clamp(var(--space-4),4vw,3.5rem)}.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-5)}.eyebrow{margin:0 0 var(--space-1);color:var(--accent-strong);font-size:.75rem;font-weight:750;letter-spacing:.11em;text-transform:uppercase}.page-header h1{margin:0;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:-.055em}.status-badge{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--border);border-radius:999px;padding:.35rem .7rem;color:var(--muted);font-size:.78rem;white-space:nowrap}.status-badge::before{content:"";width:.48rem;height:.48rem;border-radius:50%;background:currentColor}.status-badge.connected{color:var(--positive)}.status-badge.stale{color:var(--warning)}.view-intro{margin:0 0 var(--space-4);color:var(--muted)}
    .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);margin-bottom:var(--space-4)}.metric-card,.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}.metric-card{padding:var(--space-4)}.metric-card span{display:block;color:var(--muted);font-size:.78rem}.metric-card strong{display:block;margin-top:.25rem;font-size:1.8rem;letter-spacing:-.04em}.panel{overflow:hidden;margin-bottom:var(--space-4)}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border)}.panel-header h2{margin:0;font-size:1rem}.panel-body{padding:var(--space-4)}.table-wrap{width:100%;overflow-x:auto}table{width:100%;min-width:580px;border-collapse:collapse;text-align:left}th,td{padding:.72rem var(--space-4);border-bottom:1px solid var(--border);white-space:nowrap}th{color:var(--muted);font-size:.75rem;font-weight:700}tr:last-child td{border-bottom:0}.empty{padding:2rem;color:var(--muted);text-align:center}.status{display:inline-flex;align-items:center;gap:.42rem}.status::before{content:"";width:.48rem;height:.48rem;border-radius:50%;background:var(--muted)}.status.ok::before{background:var(--positive)}.status.bad::before{background:var(--negative)}.code{font:.83rem ui-monospace,SFMono-Regular,Consolas,monospace}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--space-3)}.detail{padding:var(--space-3);border:1px solid var(--border);border-radius:9px;background:var(--bg)}.detail dt{color:var(--muted);font-size:.76rem}.detail dd{margin:.2rem 0 0;font-weight:650;overflow-wrap:anywhere}
    #toast-region{position:fixed;right:var(--space-4);bottom:var(--space-4);z-index:10;display:grid;gap:var(--space-2);width:min(360px,calc(100vw - 2 * var(--space-4)))}.toast{padding:.75rem .9rem;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface);box-shadow:0 8px 25px rgba(49,38,28,.15)}.toast.error{border-left-color:var(--negative)}.toast.success{border-left-color:var(--positive)}
    @media(max-width:900px){.app-view{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border);padding:var(--space-3) var(--space-4);gap:var(--space-3)}#navigation{display:flex;overflow-x:auto;gap:.2rem}.nav-link{white-space:nowrap;padding:.5rem .65rem}.nav-link.active{box-shadow:inset 0 -3px 0 var(--accent)}.sidebar-meta{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;margin-top:0}.sidebar-meta .button{width:auto;text-align:center}.main-content{padding:var(--space-4)}}
    @media(max-width:500px){.page-header{flex-direction:column}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-card{padding:var(--space-3)}.metric-card strong{font-size:1.45rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="login-view" class="login-view"><form id="login-form" class="login-card"><h1>SmartRouter</h1><p>Sign in to the router control plane.</p><div class="field"><label for="management-key">Management key</label><input id="management-key" class="input" name="management-key" type="password" autocomplete="current-password" required></div><p id="login-error" class="login-error" role="alert"></p><button class="button primary" type="submit">Sign in</button></form></div>
  <div id="app-view" class="app-view hidden"><aside class="sidebar" aria-label="SmartRouter navigation"><a class="brand" href="#overview">SmartRouter</a><nav id="navigation"></nav><div class="sidebar-meta"><span id="revision-label">Revision —</span><span id="sync-label">Not synced</span><button id="refresh-button" class="button" type="button">Refresh</button><button id="theme-button" class="button" type="button">Toggle theme</button><button id="logout-button" class="button" type="button">Logout</button></div></aside><main class="main-content"><header class="page-header"><div><p class="eyebrow">Router control plane</p><h1 id="page-title">Overview</h1></div><span id="connection-badge" class="status-badge">Disconnected</span></header><section id="page-content" aria-live="polite"></section></main></div>
  <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script>
    const API_ROOT = "/v0/management/router";
    const SESSION_KEY = "smart-router-management-key";
    const NAV_ITEMS = [["overview","Overview"],["upstreams","Upstreams"],["model-groups","Model groups"],["route-state","Route state"],["metrics","Metrics"],["network-policy","Network policy"]];
    const app = { key:sessionStorage.getItem(SESSION_KEY)||"", revision:null, activeView:"overview", theme:sessionStorage.getItem("smart-router-theme")||"light", stale:true, loading:false, upstreams:[], modelGroups:[], routeStates:[], metrics:null, networkPolicy:null, schemas:{} };
    let pollTimer = null;
    const $ = id => document.getElementById(id);
    function showToast(message,tone="info"){if(!message)return;const toast=document.createElement("div");toast.className=`toast ${tone}`;toast.textContent=message;$("toast-region").append(toast);window.setTimeout(()=>toast.remove(),4500)}
    function setTheme(theme){app.theme=theme==="dark"?"dark":"light";document.documentElement.dataset.theme=app.theme;sessionStorage.setItem("smart-router-theme",app.theme)}
    function updateMeta(){$("revision-label").textContent=app.revision===null?"Revision —":`Revision ${app.revision}`;$('sync-label').textContent=app.stale?"Needs refresh":"Synced just now";const badge=$("connection-badge");badge.textContent=app.stale?"Stale":"Connected";badge.className=`status-badge ${app.stale?"stale":"connected"}`}
    async function api(path,options={}){const {mutation,...requestOptions}=options;const headers=new Headers(requestOptions.headers||{});if(app.key)headers.set("Authorization",`Bearer ${app.key}`);if(requestOptions.body!==undefined)headers.set("Content-Type","application/json");if(mutation&&app.revision!==null)headers.set("If-Match",`"${app.revision}"`);const response=await fetch(`${API_ROOT}${path}`,{...requestOptions,headers,body:requestOptions.body===undefined?undefined:JSON.stringify(requestOptions.body),cache:"no-store"});let data=null;try{data=await response.json()}catch(_){}if(!response.ok){const error=new Error(data?.error||`HTTP ${response.status}`);error.status=response.status;error.data=data;throw error}if(data&&Number.isInteger(data.revision))app.revision=data.revision;return data}
    async function loadAll(options={}){if(!app.key)return;app.loading=true;try{const [stateData,upstreamData,groupData,routeData,metricsData,policyData,upstreamSchema,groupSchema,policySchema]=await Promise.all([api("/state"),api("/upstreams"),api("/model-groups"),api("/routes/state"),api("/metrics"),api("/network-policy"),api("/schemas/upstream-types"),api("/schemas/model-group"),api("/schemas/network-policy")]);app.upstreams=upstreamData?.items||[];app.modelGroups=groupData?.items||[];app.routeStates=routeData?.items||metricsData?.routes||[];app.metrics=metricsData?.metrics||null;app.networkPolicy=policyData?.network_policy||null;app.schemas={upstreamTypes:upstreamSchema,modelGroup:groupSchema,networkPolicy:policySchema};app.revision=[stateData,upstreamData,groupData,routeData,metricsData,policyData].reduce((revision,item)=>Number.isInteger(item?.revision)?Math.max(revision,item.revision):revision,app.revision??0);app.stale=false;render()}catch(error){if(!options.recovering)await handleApiError(error);else throw error}finally{app.loading=false}}
    async function refreshStateAndMetrics(){if(!app.key)return;try{const [stateData,metricsData]=await Promise.all([api("/state"),api("/metrics")]);app.metrics=metricsData?.metrics||app.metrics;app.routeStates=metricsData?.routes||app.routeStates;if(Number.isInteger(stateData?.revision))app.revision=stateData.revision;app.stale=false;updateMeta();render()}catch(error){await handleApiError(error)}}
    async function handleApiError(error){if(error?.status===401){logout(false);showToast("Invalid or expired management key","error");return}if(error?.status===409){app.stale=true;updateMeta();showToast("Server state changed. Review the refreshed values before saving.","error");try{await loadAll({recovering:true})}catch(_){}return}app.stale=true;updateMeta();showToast(error?.message||"Unable to load router data","error")}
    function setView(view){const valid=NAV_ITEMS.some(([id])=>id===view)?view:"overview";app.activeView=valid;if(window.location.hash!==`#${valid}`)window.history.replaceState(null,"",`#${valid}`);renderNavigation();render()}
    function renderNavigation(){const navigation=$("navigation");navigation.replaceChildren();NAV_ITEMS.forEach(([id,label])=>{const link=document.createElement("a");link.className=`nav-link ${app.activeView===id?"active":""}`;link.href=`#${id}`;link.textContent=label;navigation.append(link)})}
    function value(item,fallback="—"){return item===undefined||item===null||item===""?fallback:String(item)}
    function panel(title,content){const section=document.createElement("section");section.className="panel";const header=document.createElement("div");header.className="panel-header";const heading=document.createElement("h2");heading.textContent=title;header.append(heading);section.append(header,content);return section}
    function table(headers,rows,empty="No records yet"){const wrap=document.createElement("div");wrap.className="table-wrap";if(!rows.length){const blank=document.createElement("div");blank.className="empty";blank.textContent=empty;wrap.append(blank);return wrap}const tableNode=document.createElement("table"),thead=document.createElement("thead"),headRow=document.createElement("tr");headers.forEach(header=>{const th=document.createElement("th");th.textContent=header;headRow.append(th)});thead.append(headRow);tableNode.append(thead);const tbody=document.createElement("tbody");rows.forEach(row=>{const tr=document.createElement("tr");row.forEach(cell=>{const td=document.createElement("td");td.textContent=value(cell);tr.append(td)});tbody.append(tr)});tableNode.append(tbody);wrap.append(tableNode);return wrap}
    function detailGrid(entries){const dl=document.createElement("dl");dl.className="detail-grid";entries.forEach(([label,item])=>{const block=document.createElement("div");block.className="detail";const dt=document.createElement("dt");dt.textContent=label;const dd=document.createElement("dd");dd.textContent=value(item);block.append(dt,dd);dl.append(block)});return dl}
    function renderOverview(){const metrics=app.metrics||{},grid=document.createElement("div");grid.className="metric-grid";[["Upstreams",app.upstreams.length],["Model groups",app.modelGroups.length],["Routes",app.routeStates.length],["Requests",metrics.requests??metrics.total_requests??"—"]].forEach(([label,item])=>{const card=document.createElement("div");card.className="metric-card";const span=document.createElement("span");span.textContent=label;const strong=document.createElement("strong");strong.textContent=value(item);card.append(span,strong);grid.append(card)});const content=document.createElement("div");content.append(grid,panel("Router state",detailGrid([["Revision",app.revision],["Sync",app.stale?"Needs refresh":"Current"],["Theme",app.theme]])));return content}
    function renderUpstreams(){return panel("Configured upstreams",table(["Name","Protocol","Base URL","Status","Auth"],app.upstreams.map(item=>[item.name||item.id,item.protocol,item.base_url,item.enabled?"Enabled":"Disabled",item.auth?.configured?"Configured":"Not configured"])))}
    function renderGroups(){return panel("Model groups",table(["Public model","Capability","Strategy","Routes","Status"],app.modelGroups.map(item=>[item.public_model||item.id,item.capability,item.selection?.strategy,item.routes?.length??0,item.enabled?"Enabled":"Disabled"])))}
    function renderRouteState(){return panel("Route circuit state",table(["Route","Upstream","State","Health","Failures","Last category"],app.routeStates.map(item=>[item.route_id,item.upstream_id,item.state,item.transport_health,item.failure_count,item.last_error_category])))}
    function renderMetrics(){const metrics=app.metrics||{};return panel("Router metrics",detailGrid(Object.entries(metrics).filter(([key])=>typeof metrics[key]!=="object").slice(0,12)))}
    function renderNetworkPolicy(){const policy=app.networkPolicy||{};return panel("Network policy",detailGrid([["Allow HTTP",policy.allow_http?"Allowed":"Blocked"],["Private hosts",(policy.allowed_private_hosts||[]).join(", ")],["Private CIDRs",(policy.allowed_private_cidrs||[]).join(", ")],["Redirect hosts",(policy.allowed_redirect_hosts||[]).join(", ")]]))}
    function render(){if($("app-view").classList.contains("hidden"))return;const titles=Object.fromEntries(NAV_ITEMS);$("page-title").textContent=titles[app.activeView]||"Overview";const content=$("page-content");content.replaceChildren();const intro=document.createElement("p");intro.className="view-intro";intro.textContent=app.loading?"Loading router data…":"Review the current SmartRouter configuration and runtime health.";content.append(intro);const views={overview:renderOverview,upstreams:renderUpstreams,"model-groups":renderGroups,"route-state":renderRouteState,metrics:renderMetrics,"network-policy":renderNetworkPolicy};content.append(views[app.activeView]());updateMeta()}
    function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=window.setInterval(refreshStateAndMetrics,5000)}
    function logout(showMessage=true){if(pollTimer){clearInterval(pollTimer);pollTimer=null}app.key="";sessionStorage.removeItem(SESSION_KEY);$("management-key").value="";$("app-view").classList.add("hidden");$("login-view").classList.remove("hidden");$("management-key").focus();if(showMessage)showToast("Signed out","success")}
    async function signIn(event){event.preventDefault();const input=$("management-key"),button=event.currentTarget.querySelector("button");app.key=input.value.trim();$("login-error").textContent="";button.disabled=true;try{await api("/state");sessionStorage.setItem(SESSION_KEY,app.key);input.value="";$("login-view").classList.add("hidden");$("app-view").classList.remove("hidden");setView(window.location.hash.slice(1)||"overview");await loadAll();startPolling();showToast("Connected","success")}catch(error){app.key="";$("login-error").textContent=error.status===401?"Invalid management key":error.message}finally{button.disabled=false}}
    $("login-form").addEventListener("submit",signIn);$("refresh-button").addEventListener("click",()=>loadAll());$("theme-button").addEventListener("click",()=>setTheme(app.theme==="dark"?"light":"dark"));$("logout-button").addEventListener("click",()=>logout());window.addEventListener("hashchange",()=>setView(window.location.hash.slice(1)||"overview"));setTheme(app.theme);renderNavigation();if(app.key){$("login-view").classList.add("hidden");$("app-view").classList.remove("hidden");setView(window.location.hash.slice(1)||"overview");loadAll();startPolling()}else $("management-key").focus();
  </script>
</body>
</html>
